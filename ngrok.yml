# Authentication: set NGROK_AUTHTOKEN in ~/.config/cursor-ollama-gateway/.env — start-stack.sh exports it.
# Do not put `${NGROK_AUTHTOKEN}` here; ngrok does not expand shell syntax and will reject it (ERR_NGROK_105).
version: "2"

tunnels:
  cursor-ollama:
    proto: http
    addr: http://127.0.0.1:8443
    # Rewrite Host to match the upstream URL — avoids some bad-gateway / odd responses when the edge sends another Host.
    host_header: rewrite
    inspect: false
